yamlname: Deploy Custom Folder to Pages

on:
  push:
    branches: ["main"] # Triggers deployment whenever you push to main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # OPTIONAL: If your custom folder needs to be built dynamically,
      # uncomment the lines below to run your build scripts.
      # - name: Install Dependencies
      #   run: npm ci
      # - name: Build Project
      #   run: npm run build

      - name: Upload Custom Folder Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # CHANGE THIS PATH: Point it to your custom deployment folder
          path: './dist' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4